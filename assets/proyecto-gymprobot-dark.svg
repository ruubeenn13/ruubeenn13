<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="282" viewBox="0 0 900 282" role="img" aria-labelledby="title">
<title id="title">GymProBot: bot de Discord en Java 21 + JDA 5 conectado a la API de GymProFit. 65 comandos slash, más de 660 tests y unas 21 000 líneas de Java. Cada push a main pasa el CI y, solo si está en verde, se construye la imagen Docker y se despliega en el homelab con aviso por ntfy.</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.p{animation:flow 3.6s linear infinite}
@keyframes flow{0%{stroke-dashoffset:16}38%,100%{stroke-dashoffset:-100}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}75%,100%{transform:scale(2.9);opacity:0}}
.ok{animation:ok 6s ease-out infinite both}
@keyframes ok{0%{opacity:0}6%,80%{opacity:1}92%,100%{opacity:0}}
.down{animation:down 6s linear infinite}
@keyframes down{0%{stroke-dashoffset:12}40%,100%{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.p,.ping{animation:none}.ok,.down{animation:none}}
</style>
