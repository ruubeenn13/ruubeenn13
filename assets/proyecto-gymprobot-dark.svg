e="#30363d"/><text x="333.4" y="248" class="m" font-size="11" fill="#8b949e" text-anchor="middle" textLength="92.4" lengthAdjust="spacing">Testcontainers</text><g transform="translate(462 22)"><path d="M30 28V214" stroke="#30363d" stroke-width="1.5"/><path class="down" d="M30 28V214" pathLength="100" stroke-dasharray="12 220" stroke-dashoffset="12" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="30" cy="28" r="9" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><g class="ok" style="animation-delay:0s"><circle cx="30" cy="28" r="9" fill="#3fb950"/><path d="M26.4 28.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="27" class="s" font-size="12.5" fill="#e6edf3" font-weight="600">git push a main</text><text x="50" y="41" class="m" font-size="10" fill="#8b949e">GitHub</text><circle cx="30" cy="68" r="9" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><g class="ok" style="animation-delay:0.55s"><circle cx="30" cy="68" r="9" fill="#3fb950"/><path d="M26.4 68.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="67" class="s" font-size="12.5" fill="#e6edf3" font-weight="600">CI: build + 660+ tests</text><text x="50" y="81" class="m" font-size="10" fill="#8b949e">JUnit 5 · Mockito · Testcontainers</text><circle cx="30" cy="134" r="9" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><g class="ok" style="animation-delay:1.1s"><circle cx="30" cy="134" r="9" fill="#3fb950"/><path d="M26.4 134.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="133" class="s" font-size="12.5" fill="#e6edf3" font-weight="600">docker build</text><text x="50" y="147" class="m" font-size="10" fill="#8b949e">runner self-hosted en el homelab</text><circle cx="30" cy="174" r="9" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><g class="ok" style="animation-delay:1.65s"><circle cx="30" cy="174" r="9" fill="#3fb950"/><path d="M26.4 174.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="173" class="s" font-size="12.5" fill="#e6edf3" font-weight="600">docker compose up -d</text><text x="50" y="187" class="m" font-size="10" fill="#8b949e">Uptime Kuma vigila /health</text><circle cx="30" cy="214" r="9" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><g class="ok" style="animation-delay:2.2s"><circle cx="30" cy="214" r="9" fill="#3fb950"/><path d="M26.4 214.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="213" class="s" font-size="12.5" fill="#e6edf3" font-weight="600">aviso por ntfy</text><text x="50" y="227" class="m" font-size="10" fill="#8b949e">éxito o fallo, al móvil</text><path d="M30 95l6 6l-6 6l-6-6z" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><rect x="50" y="91" width="182" height="20" rx="10" fill="#0d1117" stroke="#3fb950"/><text x="141" y="104.6" class="m" font-size="10" fill="#3fb950" text-anchor="middle" textLength="162" lengthAdjust="spacing">solo si el CI está en verde</text></g>
